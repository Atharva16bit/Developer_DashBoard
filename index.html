<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI & Developer Dashboard — 150+ Curated AI & Dev Tools</title>
    <meta
      name="description"
      content="A curated, searchable directory of 150+ AI and developer tools across writing, research, coding, design, automation, and video. Free and paid options for every workflow."
    />
    <meta
      name="keywords"
      content="AI tools, developer tools, AI directory, coding tools, productivity tools, free AI tools, AI tool list"
    />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.com/" />

    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="AI & Developer Dashboard — 150+ Curated AI & Dev Tools"
    />
    <meta
      property="og:description"
      content="A searchable directory of 150+ AI and developer tools — writing, research, coding, design, automation, and more, all in one place."
    />
    <meta
      property="og:image"
      content="https://your-domain.com/assets/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:site_name" content="AI & Developer Dashboard" />

    <!-- ============ Favicons ============ -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/site.webmanifest" />

    <!-- ============ Performance ============ -->
    <link rel="preconnect" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="preload" href="tools.json" as="fetch" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
    
    <!-- ============ Vercel Speed Insights ============ -->
    <script type="module" src="speed-insights.js"></script>

    <!-- ============ Structured Data (JSON-LD) ============ -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AI & Developer Dashboard",
        "description": "A curated, searchable directory of 150+ AI and developer tools.",
        "url": "https://your-domain.com/"
      }
    </script>
  </head>

  <body>
    <header>
      <div class="hero">
        <h1>AI & Developer Dashboard</h1>
        <p class="hero-tagline">
          One Place for Coding, AI, Research, Creativity & Productivity
        </p>
        <div class="hero-stats">
          <span>151 Tools</span>
          <span class="hero-dot" aria-hidden="true">•</span>
          <span>17 Categories</span>
          <span class="hero-dot" aria-hidden="true">•</span>
          <span>Free &amp; Paid</span>
        </div>
        <a href="#category-nav" class="hero-scroll">
          Explore Tools
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12l7 7 7-7" />
          </svg>
        </a>
      </div>
    </header>

    <div class="sticky-header">
      <div class="controls">
        <div class="search-wrap">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input
            id="search-input"
            type="text"
            placeholder="Search tools by name…"
            autocomplete="off"
            aria-label="Search tools"
          />
        </div>
        <div class="filter-group" role="group" aria-label="Filter by pricing">
          <button class="filter-btn is-active" data-pricing="all" type="button">
            All
          </button>
          <button class="filter-btn" data-pricing="free" type="button">
            Free
          </button>
          <button class="filter-btn" data-pricing="paid" type="button">
            Paid
          </button>
        </div>
      </div>

      <nav
        class="category-nav"
        id="category-nav"
        aria-label="Jump to category"
      ></nav>
    </div>

    <main id="sections-root">
      <!-- Sections are rendered here dynamically from tools.json by app.js -->
    </main>

    <p class="empty-state" id="empty-state" hidden>
      No tools match your search. Try a different keyword or filter.
    </p>

    <div class="stats">
      <h3 id="stats-count">Total Tools Available: 150+</h3>
    </div>

    <footer>
      <p>AI & Developer Dashboard © 2026</p>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
